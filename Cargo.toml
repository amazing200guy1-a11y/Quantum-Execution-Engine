[package]
name        = "quantum-order-router"
version     = "0.1.0"
edition     = "2021"
description = "Lock-free async order routing layer for Quantum-Execution-Engine"
license     = "MIT"
authors     = ["Usman Abayomi Bamidele <usmanbamidele200@gmail.com>"]
repository  = "https://github.com/amazing200guy1-a11y/Quantum-Execution-Engine"

[[bin]]
name = "order_router"
path = "src/order_router.rs"

[dependencies]
tokio  = { version = "1", features = ["full"] }
thiserror = "1"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"

[profile.bench]
inherits = "release"
debug    = true

name: CI — Build, Test & Benchmark

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── C++20 Risk Kernel: compile → unit tests → benchmark ─────────────────────
  cpp-risk-kernel:
    name: C++20 Risk Kernel (GCC 13, Release + AVX2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 13 & CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13 g++-13 cmake ninja-build
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 100
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 100

      - name: Configure (Release -O3 -march=native -mavx2)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-13

      - name: Build risk_kernel static library, test binary, and bench binary
        run: cmake --build build --parallel

      - name: ✅ Run unit test suite
        run: ./build/test_risk

      - name: 📊 Run latency benchmark (10M evaluations)
        run: ./build/bench_risk

  # ── Rust 2021 Order Router: fmt → clippy → tests ─────────────────────────────
  rust-order-router:
    name: Rust 2021 Order Router (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        run: cargo clippy -- -D warnings

      - name: cargo test --release
        run: cargo test --release
